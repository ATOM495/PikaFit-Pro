name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Restore Signing Keystore
      run: |
        if [ ! -f debug.keystore ]; then
          echo "Restoring official debug.keystore..."
          echo "" | base64 -d > debug.keystore
        fi
        echo "debug.keystore ready."

    - name: Ensure google-services.json
      run: |
        if [ ! -f app/google-services.json ]; then
          echo "Notice: app/google-services.json not found in repository. Auto-generating production configuration..."
          mkdir -p app
          echo "" | base64 -d > app/google-services.json
        fi
        echo "app/google-services.json ready."

    - name: Ensure Gradle Wrapper
      run: |
        if [ ! -f gradlew ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Prepare PikaFit APK
      run: cp app/build/outputs/apk/debug/app-debug.apk PikaFit.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PikaFit-APK
        path: PikaFit.apk
        retention-days: 14

    - name: Publish or Attach APK to GitHub Release
      if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: PikaFit.apk
        name: PikaFit ${{ github.ref_name || github.event.release.tag_name }}
        tag_name: ${{ github.ref_name || github.event.release.tag_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
